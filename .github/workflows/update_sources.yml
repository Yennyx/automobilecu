name: Update commercial vehicle sources

on:
  schedule:
    - cron: "0 23 * * 0"  # 월요일 08:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Check official sources
        run: python scripts/update_sources.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source_status.json
          git diff --cached --quiet || git commit -m "chore: update source monitoring timestamp"
          git push
