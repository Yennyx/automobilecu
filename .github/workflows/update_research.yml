name: Refresh DOI research library

on:
  schedule:
    - cron: "15 15 * * *" # daily 00:15 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and verify DOI metadata
        run: python scripts/ingest_research.py
      - name: Commit verified research
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research-official.json
          git diff --cached --quiet || git commit -m "chore: refresh verified research library"
          git push
